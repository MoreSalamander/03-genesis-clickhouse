name: genesis-institutional
# Local analytical stack for Genesis OS — Institutional Intelligence.
#   docker compose up -d
# ClickHouse HTTP:    http://localhost:8123      (writer: genesis / genesis-institutional)
# ClickHouse native:  localhost:19000            (default 9000 is owned by 01's MinIO)
# mcp-clickhouse:     http://localhost:8687/mcp  ← set CLICKHOUSE_MCP_URL to this
# Temporal UI:        http://localhost:8235
# (ClickHouse Cloud swap = point the MCP server env at the Cloud host; decided at deploy time.)
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: genesis_institutional
      CLICKHOUSE_USER: genesis            # writer — seeder + ingest only, never MCP
      CLICKHOUSE_PASSWORD: genesis-institutional
    ports: ["8123:8123", "19000:9000"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/users.d/genesis.xml:/etc/clickhouse-server/users.d/genesis.xml:ro
      - ../seed/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # busybox wget resolves `localhost` to ::1 but this image binds IPv4 only
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mcp-clickhouse:
    # Official ClickHouse MCP server (PyPI `mcp-clickhouse`, by ClickHouse) —
    # the VERIFIED runtime-proof path for the track. Connects as the read-only
    # `mcp` user; agents reach ClickHouse exclusively through this server.
    build: ./mcp-clickhouse
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: mcp
      CLICKHOUSE_PASSWORD: mcp-institutional
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      CLICKHOUSE_DATABASE: genesis_institutional
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: "8000"
      # static bearer token for the HTTP transport (local dev value; the hosted
      # deployment injects this from Secret Manager)
      CLICKHOUSE_MCP_AUTH_TOKEN: ${CLICKHOUSE_MCP_AUTH_TOKEN:-genesis-institutional-mcp}
    ports: ["8687:8000"]
    depends_on:
      clickhouse:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: genesis
      POSTGRES_DB: genesis_institutional
    ports: ["5435:5432"]
    volumes:
      - pgdata_institutional:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports: ["4225:4222"]

  redis:
    image: redis:7-alpine
    ports: ["6382:6379"]

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: genesis
      POSTGRES_PWD: genesis
      POSTGRES_SEEDS: postgres
    ports: ["7235:7233"]
    depends_on: [postgres]

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8235
    ports: ["8235:8080"]
    depends_on: [temporal]

volumes:
  chdata:
  pgdata_institutional:
